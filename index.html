:root{--paper:#F2EEDC;--ink:#322E36;--muted:#8B7A60;--ember:#D96C38;--cream:#FBF7EA}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--paper);color:var(--ink);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}

code{background:var(--cream);padding:.1em .35em;border-radius:4px;font-size:.9em}

.nav{margin:0 0 2rem;font-size:.92rem}

 border-left:3px solid var(--ember);border-radius:0 8px 8px 0}
@media (prefers-color-scheme:dark){
 :root{--paper:#242028;--ink:#EDE7DA;--cream:#2E2934;--muted:#A2977F}
 h2{border-top-color:rgba(237,231,218,.14)} hr{border-top-color:rgba(237,231,218,.14)}}
